<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход</title>
<style>
body{
font-family:Arial,sans-serif;
background:#111;
color:white;
display:flex;
justify-content:center;
padding:30px;
}
.container{
width:700px;
background:#1e1e1e;
padding:25px;
border-radius:15px;
}
input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
}
button{
background:#3b82f6;
color:white;
font-size:16px;
cursor:pointer;
}
.small{
font-size:12px;
opacity:.7;
margin-top:15px;
}
pre{
background:black;
padding:10px;
overflow:auto;
}
</style>
</head>
<body>
<div class="container">
<h2>Вход</h2>

<input id="name" placeholder="Имя">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Телефон">
<input id="city" placeholder="Город">
<input id="birth" type="date">

<button onclick="collectData()">Войти</button>

<p class="small">
Эта страница собирает информацию только открыто и с согласия пользователя.
</p>

<h3>Собранные данные:</h3>
<pre id="output"></pre>
</div>

<script>
async function collectData(){
let data={
name:document.getElementById('name').value,
email:document.getElementById('email').value,
phone:document.getElementById('phone').value,
city:document.getElementById('city').value,
birth:document.getElementById('birth').value,

browser:navigator.userAgent,
language:navigator.language,
platform:navigator.platform,
cookies:navigator.cookieEnabled,
online:navigator.onLine,
cores:navigator.hardwareConcurrency,
ram:navigator.deviceMemory || 'не поддерживается',
timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
screen:screen.width + 'x' + screen.height,
colorDepth:screen.colorDepth,
windowSize:window.innerWidth+'x'+window.innerHeight,
referrer:document.referrer || 'нет',
url:window.location.href,
date:new Date().toString()
};

if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
data.latitude=pos.coords.latitude;
data.longitude=pos.coords.longitude;
show(data);
},()=>show(data));
}else{
show(data)
}
}

function show(data){
document.getElementById('output').textContent=
JSON.stringify(data,null,2);

// для отправки на сервер / GitHub API / Firebase:
// fetch("YOUR_API",{
// method:"POST",
// headers:{"Content-Type":"application/json"},
// body:JSON.stringify(data)
// })
}
</script>
</body>
</html>
