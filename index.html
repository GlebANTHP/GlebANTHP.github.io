<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>!!! ☢☠☢ !!!</title>
    <style>
        body {
            background-color: #FFD700;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            cursor: crosshair;
            margin: 0;
            overflow-x: hidden;
        }

        /* Полная анархия в расположении */
        .glitch-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .main-banner {
            border: 10px double #000;
            box-shadow: 20px 20px 0px rgba(0,0,0,0.5);
            max-width: 90%;
            margin: 20px;
        }

        marquee {
            height: 50px;
            background: #000;
            border-top: 2px solid #fff;
            border-bottom: 2px solid #fff;
        }

        .gif-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .chaos-img {
            width: 100px;
            filter: drop-shadow(5px 5px 0px #000);
        }

        .blink {
            animation: blinker 0.5s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Старые кнопки без текста */
        .btn-icon {
            display: inline-block;
            width: 50px;
            height: 50px;
            background: #ccc;
            border: 4px outset #fff;
            text-align: center;
            line-height: 50px;
            font-size: 30px;
            text-decoration: none;
            margin: 10px;
        }

        .btn-icon:active {
            border-style: inset;
        }

        #fire-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 100px;
            background-image: url('https://web.archive.org/web/20090831190141/http://geocities.com/TimesSquare/Labyrinth/7325/fire.gif');
            background-repeat: repeat-x;
            pointer-events: none;
        }
    </style>
</head>
<body>

<marquee scrollamount="20">
